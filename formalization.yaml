    - {source: "Plantholt–Shan Lemma 2.12", lean: "PlantholtShan.exists_spanning_paths", module: "PlantholtShanChallenge", status: "proved"}
    - {source: "Plantholt–Shan Lemma 2.11", lean: "PlantholtShan.lemma_2_11", module: "PlantholtShanChallenge", status: "proved"}
    - {source: "Plantholt–Shan Theorem 1.3, Condition (b)", lean: "PlantholtShan.theorem_1_3b", module: "PlantholtShanChallenge", status: "proved"}
    - {source: "Plantholt–Shan Theorem 1.3, Condition (c)", lean: "PlantholtShan.theorem_1_3c", module: "PlantholtShanChallenge", status: "proved"}
    - {source: "Plantholt–Shan Theorem 1.2", lean: "PlantholtShan.theorem_1_2", module: "PlantholtShanChallenge", status: "proved"}

