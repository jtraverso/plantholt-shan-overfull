      Hamiltonicity.walkOf.
  - id: "PALOMAR-2026-10-16-000017 (Erdős–Gallai and Havel–Hakimi)"
    relationship: "related"
    note: "Simple-graph degree sequences (Havel–Hakimi); the multigraph theorem here is a different statement."

status:
  scope: >-
    Theorems 1.2 and 1.3 (b), (c) of Plantholt–Shan with the auxiliary results Theorem 2.5,
    Theorem 2.6 (δ ≥ n/2 + 1), Lemmas 2.11 and 2.12. Condition (a) of Theorem 1.3 is the registered
    asymptotic-one-factorization entry. The polynomial-time algorithms are not formalized.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["Claude Opus 5.5"]
      framework: "Claude Code (Anthropic)"
      tool_setup: >-
        Read the article, wrote the library (PSLib/), the Challenge/Solution pair and the packaging
        under the author's direction. Checked with a local build against the pinned dependency,
        #print axioms and a comparison of the elaborated Challenge and Solution statements (pp.all)
        (Lean v4.35.0-rc3, Mathlib c55e6e786f49471c72fbddbec5415808896aec1e).
      cost:
        wall_time: "about one day"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: "Natural-language instructions in Spanish, directed by the author."
  spend_usd: "subscription-based"
  notes: >-
    The Lean development is AI-written under the author's direction and mechanically verified: no
    sorry, axioms limited to propext, Classical.choice and Quot.sound, identical elaborated
    statements in the Challenge and the Solution.

fidelity:
  divergences: >-
    Explicit, non-optimized thresholds N instead of the existence of n0; the overfull condition is
    the registered Plantholt.HasOverfullSubgraph; chromatic index Δ is stated as colourability of
    the line graph with Δ colours. The proofs of Theorems 1.2 and 1.3 (c) are reorganized as
    described in the source note (no Lemmas 2.7, 2.10 or edge additions; perfect matchings instead
    of linear forests in Case 2). Explicit linear constants in Lemma 2.12; Theorem 2.6 in the
    δ ≥ n/2 + 1 form; Hakimi's theorem for degree functions.

review:
  status: "agent-reviewed"
  reviewers:
    - "Claude Opus 5.5 (AI agent in Claude Code, acting for the author)"
  notes: >-
    Agent review by Claude Opus 5.5, checking the statements against the article. Smallest cases:
    one vertex for Hakimi (only d = 0); n = 5 forces K₅ for Hamilton-connectedness; t = 0 in Lemma
    2.12 is Hamilton-connectedness; t = 0 in Lemma 2.11 is Hall for degrees at least n/2; for
    Theorem 1.2 the odd sets V − z are the obstructions in graphs of even order. No independent
    human review has been performed. No novelty is claimed.

