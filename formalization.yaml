    relationship: "builds-on"
    note: "Pinned dependency: Condition (a) (Perković–Reed via Vaughan) for the regular cases; the Chernoff bounds and AOF.exists_perm_of_equitable."
  - id: "PALOMAR-2026-10-29-000023 (jtraverso/shannon-edge-colouring @ d590cfe)"
    relationship: "builds-on"
    note: "Pinned dependency: Shannon's theorem and the Kempe machinery used for equalization."
  - id: "PALOMAR-2026-10-15-000004 v2 (jtraverso/vizing @ 33b2de8)"
    relationship: "builds-on"
    note: "Pinned dependency: Vizing's theorem for the halves and for Δ(G) + 1 ≤ D."
  - id: "PALOMAR-2026-11-04-000016 v2 (jtraverso/plantholt-overfull-criterion @ f890094)"
    relationship: "builds-on"
    note: "Pinned dependency: Plantholt.HasOverfullSubgraph, Plantholt.noOverfull_iff and Plantholt.two_mul_eIn_le_of_colorable."
  - id: "PALOMAR-2026-10-15-000020 v2 (jtraverso/menger-hamiltonian @ 35c5f68)"
    relationship: "builds-on"
    note: >-
