version: "v0.4"

project:
  name: "Plantholt–Shan: the overfull conjecture for graphs of minimum degree at least (1 + ε) n"
  description: >-
    M. J. Plantholt and S. Shan, Edge coloring graphs with large minimum degree (arXiv:2105.05286),
    in Lean 4 / Mathlib. theorem_1_2 (Theorem 1.2): for every ε > 0 there is N such that a graph G
    on 2n vertices, n ≥ N, with δ(G) ≥ (1 + ε) n is Δ(G)-edge-colourable iff it has no
    Δ(G)-overfull subgraph (Plantholt.HasOverfullSubgraph of the registered
    plantholt-overfull-criterion entry: an odd set of at least three vertices spanning more than
    Δ(G)(|S| − 1)/2 edges). theorem_1_3b (Theorem 1.3, Condition (b)): two vertices x ≠ y with
    d(x) = d(y) ≥ (1/2 + 3ε/2) n, all other vertices of degree Δ(G) ≥ (1 + ε) n and
    Δ(G) − δ(G) ≤ (1/2 − ε/2) n give χ′ = Δ for n ≥ N. theorem_1_3c (Condition (c)):
    Δ(G) − δ(G) ≥ n^{6/7}, at least n^{6/7} vertices of degree δ(G), at least n + 1 of degree Δ(G)
    and δ(G) ≥ (1 + ε) n give χ′ = Δ for n ≥ N (n^{6/7} as a real power). Condition (a) (regular
    graphs) is the registered asymptotic-one-factorization entry. lemma_2_11 (Lemma 2.11): a
    bipartite graph with sides of size n, all degrees at least t and at most t vertices of degree
    below n/2 has a perfect matching. Kept from version 1: hakimi (Theorem 2.5),
    hamiltonConnected_of_minDegree (Theorem 2.6, δ ≥ n/2 + 1) and exists_spanning_paths
    (Lemma 2.12). The thresholds N are explicit but huge (e.g. (2^60 q + 1)^21 with 1/q < ε) and
    not optimized. One definition (IsMultigraph). Seven statements.
  authors:
    - "Juan Pablo Traverso Gianini"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Juan Pablo Traverso Gianini"

classification:
  arxiv: ["math.CO"]
  msc2020: ["05C15", "05C07", "05C38", "05C45", "05C70"]

repository:
  role: "substantive-development"

sources:
  - title: "Edge coloring graphs with large minimum degree"
    authors:
      - "Michael J. Plantholt"
      - "Songling Shan"
    id: "arXiv:2105.05286"
    type: "paper"
    location: "arXiv:2105.05286v2: Theorems 1.2 and 1.3 (b), (c); Theorem 2.5, Theorem 2.6 (second part), Lemmas 2.11 and 2.12; Section 4."
    relationship: "formalizes"
    note: >-
      Theorem 1.3 (b), (c) follow the structure of Section 4 (balanced split with prescribed pairs,
      Vizing colouring of the two halves, dummy edges between deficient vertices of one side,
      McDiarmid equalization, alternating paths making the k old colour classes perfect matchings,
      l new colours on the uncoloured inner multigraph completed by Lemma 2.11, Kőnig on the rest),
      reorganized around single transfer moves and with explicit parameters. Theorem 1.2 follows
      Section 3 with two changes: Case 2 removes, for each group of a Shannon colouring of the
      Hakimi multigraph of deficiencies, a perfect matching of G and one of G − W (equivalent to a
      spanning linear forest), and the edge additions and Lemmas 2.7, 2.10 are not needed because
      the proof of (c) does not use |V_Δ| ≥ n + 1 (the hypothesis is kept in the statement).
      Lemma 2.12 has explicit linear constants; Theorem 2.6 is in the form δ ≥ n/2 + 1. The
      formalization is by a different author; the article's authors were not involved.
    license: "arXiv non-exclusive license"
    author_endorsement: "not-contacted"
  - title: "On Realizability of a Set of Integers as Degrees of the Vertices of a Linear Graph. I"
    authors:
      - "S. L. Hakimi"
    id: "doi:10.1137/0110037"
    type: "paper"
    location: "Journal of the Society for Industrial and Applied Mathematics 10 (1962), 496–506."
    relationship: "formalizes"
    note: "The multigraph degree-sequence theorem; proof written from the statement."
    license: "all rights reserved"
    author_endorsement: "not-contacted"
  - title: "The chromatic index of multigraphs that are nearly full"
    authors:
      - "Colin McDiarmid"
    type: "paper"
    location: "The equalization lemma for multigraph edge colourings (Plantholt–Shan, Lemma 2.3)."
    relationship: "formalizes"
    note: "Equalization of the colour classes of a multigraph colouring by Kempe changes (PSLib/Equalize.lean)."
    license: "all rights reserved"
    author_endorsement: "not-contacted"
  - title: "An asymptotic version of the multigraph 1-factorization conjecture"
    authors:
      - "E. R. Vaughan"
    id: "arXiv:1010.5192"
    type: "paper"
    location: "arXiv:1010.5192, Lemma 14 (the scheme extended in Plantholt–Shan, Section 4)."
    relationship: "background"
    license: "arXiv non-exclusive license"
    author_endorsement: "not-contacted"
  - title: "Hamilton connected graphs"
    authors:
      - "Øystein Ore"
    type: "paper"
    location: "Journal de Mathématiques Pures et Appliquées 42 (1963), 21–27."
    relationship: "background"
    note: "Ore's sharp Hamilton-connectedness theorem (σ₂ ≥ n + 1); the weaker δ ≥ n/2 + 1 form is formalized."
    license: "all rights reserved"
    author_endorsement: "not-contacted"

