name = "plantholt_shan"
version = "0.1.0"
defaultTargets = ["PSLib", "PlantholtShanChallenge", "PlantholtShanSolution"]
requiresModuleSystem = true

[leanOptions]
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc3"

[[require]]
name = "menger_hamilton"
git = "https://github.com/jtraverso/menger-hamiltonian"
rev = "35c5f684f9bfbd244bd0999ce725623ab571adb6"

[[lean_lib]]
name = "PSLib"
globs = ["PSLib.+"]

[[lean_lib]]
name = "PlantholtShanChallenge"
roots = ["PlantholtShanChallenge"]

[[lean_lib]]
name = "PlantholtShanSolution"
roots = ["PlantholtShanSolution"]
